name: SeedProof — validación diaria de fuentes

# Sin IA y sin secrets. Abre cada fuente citada, compara con la corrida
# anterior y solo commitea si hubo un cambio real (o en la primera corrida,
# que fija la línea base). Sin cambios: sale con código 3 y no commitea nada.

on:
  schedule:
    # Todos los días a las 08:30 UTC (05:30 ART).
    - cron: "30 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seedproof-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar fuentes
        id: run
        run: |
          set -uo pipefail
          set +e
          python scripts/validate_sources.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "La validación falló (exit $code) — ver el log de arriba."
            exit 1
          fi

      - name: Commitear el reporte
        if: steps.run.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "seedproof-bot"
          git config user.email "88945030+gonzalodiascenzi@users.noreply.github.com"
          git add -A
          git commit -m "Validación de fuentes: cambios detectados respecto de la corrida anterior"
          git pull --rebase origin main
          git push origin main
